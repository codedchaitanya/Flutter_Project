name: todoapp
description: "Taskly: a polished Flutter to-do app with priorities, due dates, categories, search, stats and offline storage."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive_flutter: ^1.1.0
  flutter_slidable: ^5.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
